<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Trả lại lựa chọn Smart+</h1>

    <div id="vung">
      <div id="trangThai" class="the">Đang đọc trang…</div>

      <label class="gat">
        <input type="checkbox" id="bat" />
        <span>Bật cho ads.tiktok.com</span>
      </label>

      <button id="taiLai" class="nut">Tải lại trang</button>

      <p class="ghi">
        Tiện ích ghi đúng cờ opt-out mà nút <b>Switch back</b> của TikTok dùng, nên
        lựa chọn <b>Chiến dịch thủ công</b> hiện ra do chính Ads Manager vẽ.
        TikTok xoá cờ này mỗi lần rời trang, nên tiện ích ghi lại sau mỗi lần tải.
      </p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
